name: Publish (PyPI)

on:
  push:
    tags:
      - "python-v*"

concurrency:
  group: publish-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # <-- MANDATORY: Required for production Trusted Publishing OIDC
    defaults:
      run:
        working-directory: python/datarobot-opentelemetry
    environment:
      name: Release   # <-- Set up your Trusted Publisher targeting this environment on PyPI
      deployment: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: python/datarobot-opentelemetry/pyproject.toml

      - name: Verify release ref and version
        run: |
          # Only assert version matching logic if triggered by a Git Tag.
          # Bypasses checking pattern strings if triggered manually via workflow_dispatch.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            case "${GITHUB_REF_NAME}" in
              python-v*) ;;
              *)
                echo "Tag must match python-v* (found: ${GITHUB_REF_NAME})"
                exit 1
                ;;
            esac

            PYPROJECT_VERSION=$(grep -E '^[[:space:]]*version[[:space:]]*=' -m1 pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')
            TAG_VERSION="${GITHUB_REF_NAME#python-v}"
            echo "pyproject version: $PYPROJECT_VERSION"
            echo "tag version: $TAG_VERSION"
            if [ "$PYPROJECT_VERSION" != "$TAG_VERSION" ]; then
              echo "Version mismatch: pyproject.toml ($PYPROJECT_VERSION) != tag ($TAG_VERSION)"
              exit 1
            fi
          else
            echo "Workflow executed via manual workflow_dispatch. Skipping Git tag validation rules."
          fi

      - name: Verify changelog contains release notes
        run: |
          VERSION=$(grep -E '^[[:space:]]*version[[:space:]]*=' -m1 pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')
          if ! grep -q "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "Missing release notes for version ${VERSION} in CHANGELOG.md"
            exit 1
          fi

      - name: Ensure version not on PyPI
        run: |
          PKG_NAME=datarobot-opentelemetry
          VERSION=$(grep -E '^[[:space:]]*version[[:space:]]*=' -m1 pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "Checking if version $VERSION is already published..."
          
          # Use curl safely and assert if PyPI returns valid JSON tracking this version
          if curl -fsSL "https://pypi.org/pypi/${PKG_NAME}/json" | jq -e --arg v "$VERSION" '.releases | has($v)' >/dev/null; then
            echo "CRITICAL ERROR: Version $VERSION already exists on PyPI. Cannot re-release."
            exit 1
          fi

      - name: Run Tests (Production Guard)
        run: uv run pytest -v tests/unit

      - name: Run Formatter & Linter Check
        run: |
          uv run ruff format --check src
          uv run ruff check src

      - name: Build distribution
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/datarobot-opentelemetry/dist
          skip-existing: false