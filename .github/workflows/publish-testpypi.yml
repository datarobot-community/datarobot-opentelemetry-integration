name: Publish (TestPyPI)

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

concurrency:
  group: publish-testpypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       contains(github.event.comment.body, '/build') &&
       github.event.issue.pull_request != null &&
       (github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'COLLABORATOR'))
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write # <-- MANDATORY: Added for TestPyPI Trusted Publishing
    defaults:
      run:
        working-directory: python/datarobot-opentelemetry
    environment:
      name: Build
      deployment: false
    steps:
      - name: Checkout PR head
        if: github.event_name == 'issue_comment'
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head

      - name: Checkout current ref
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4

      - name: Block fork PR builds
        if: github.event_name == 'issue_comment'
        env:
          PR_URL: ${{ github.event.issue.pull_request.url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HEAD_REPO=$(curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${PR_URL}" | jq -r '.head.repo.full_name')

          if [ "${HEAD_REPO}" != "${GITHUB_REPOSITORY}" ]; then
            echo "Refusing to publish for fork PR: ${HEAD_REPO}"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: python/datarobot-opentelemetry/pyproject.toml

      - name: Stamp dev version for build
        run: |
          BASE_VERSION=$(grep -E '^[[:space:]]*version[[:space:]]*=' -m1 pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')
          export DEV_VERSION="${BASE_VERSION}.dev${GITHUB_RUN_NUMBER}"

          python - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("pyproject.toml")
          dev_version = os.environ["DEV_VERSION"]
          text = path.read_text()
          updated_text, count = re.subn(
              r'^version\s*=\s*"[^"]*"',
              f'version = "{dev_version}"',
              text,
              count=1,
              flags=re.MULTILINE,
          )
          if count != 1:
              raise SystemExit("Could not find project version line in pyproject.toml")
          path.write_text(updated_text)
          PY

          echo "Stamped dev version: ${DEV_VERSION}"

      - name: Run Tests
        run: |
          uv run pytest -v tests/unit

      - name: Run Formatter Check
        run: |
          uv run ruff format --check src

      - name: Run Linter Check
        run: |
          uv run ruff check src

      - name: Build distribution
        run: |
          uv build

      - name: Extract package version
        id: get_version
        run: |
          VERSION=$(grep -E '^[[:space:]]*version[[:space:]]*=' -m1 pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "PACKAGE_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: python/datarobot-opentelemetry/dist
          skip-existing: true
          # Note: The 'password' line was removed to automatically fallback to Trusted Publishing (OIDC token exchange)

      - name: Comment on PR with TestPyPI link
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.issue.number;
            const version = process.env.PACKAGE_VERSION;
            const pkg = 'datarobot-opentelemetry';
            const projectUrl = `https://test.pypi.org/project/${pkg}/${version}/`;
            const uvInstall = `uv pip install --refresh --prerelease=allow --index-strategy=unsafe-best-match -i https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple "${pkg}==${version}"`;
            const pipInstall = `python -m pip install --pre -i https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple "${pkg}==${version}"`;
            const simpleLine = `https://test.pypi.org/simple/ ${pkg}==${version}`;
            const body = [
              `Published dev build to TestPyPI: ${projectUrl}`,
              '',
              'uv (TestPyPI + PyPI):',
              '```bash',
              uvInstall,
              '```',
              '',
              'pip (TestPyPI + PyPI):',
              '```bash',
              pipInstall,
              '```',
              '',
              'Index + spec:',
              '```',
              simpleLine,
              '```'
            ].join('\n');
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            } catch (error) {
              console.log(`Failed to comment on PR: ${error.message}`);
              console.log('This may happen for PRs from forks due to GitHub token permissions.');
            }