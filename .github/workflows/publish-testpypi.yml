name: Publish (TestPyPI)

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

concurrency:
  group: publish-testpypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       contains(github.event.comment.body, '/build') &&
       github.event.issue.pull_request != null &&
       (github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'COLLABORATOR'))
    permissions:
      contents: read
      pull-requests: write
      issues: write
    environment:
      name: Build
      deployment: false
    steps:
      - name: Checkout PR head
        if: github.event_name == 'issue_comment'
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head

      - name: Checkout current ref
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Stamp dev version for PR builds
        run: |
          cd python/datarobot-opentelemetry
          BASE_VERSION=$(grep -E '^[[:space:]]*version[[:space:]]*=' -m1 pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')
          DEV_VERSION="${BASE_VERSION}.dev${GITHUB_RUN_NUMBER}"
          # replace only the first version occurrence
          sed -i -E "0,/^version\s*=\s*\"[^\"]*\"/s//version = \"${DEV_VERSION}\"/" pyproject.toml
          echo "Stamped dev version: ${DEV_VERSION}"

      - name: Run Tests
        run: |
          cd python/datarobot-opentelemetry
          uv run pytest -v tests/unit

      - name: Run Formatter Check
        run: |
          cd python/datarobot-opentelemetry
          uv run ruff format --check src

      - name: Run Linter Check
        run: |
          cd python/datarobot-opentelemetry
          uv run ruff check src

      - name: Build distribution
        run: |
          cd python/datarobot-opentelemetry
          uv build

      - name: Extract package version
        id: get_version
        run: |
          cd python/datarobot-opentelemetry
          VERSION=$(grep -E '^[[:space:]]*version[[:space:]]*=' -m1 pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "PACKAGE_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          repository-url: https://test.pypi.org/legacy/
          packages-dir: python/datarobot-opentelemetry/dist
          skip-existing: true

      - name: Comment on PR with TestPyPI link
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.issue.number;
            const version = process.env.PACKAGE_VERSION;
            const pkg = 'datarobot-opentelemetry';
            const projectUrl = `https://test.pypi.org/project/${pkg}/${version}/`;
            const uvInstall = `uv pip install --refresh --prerelease=allow --index-strategy=unsafe-best-match -i https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple "${pkg}==${version}"`;
            const pipInstall = `python -m pip install --pre -i https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple "${pkg}==${version}"`;
            const simpleLine = `https://test.pypi.org/simple/ ${pkg}==${version}`;
            const body = [
              `Published dev build to TestPyPI: ${projectUrl}`,
              '',
              'uv (TestPyPI + PyPI):',
              '```bash',
              uvInstall,
              '```',
              '',
              'pip (TestPyPI + PyPI):',
              '```bash',
              pipInstall,
              '```',
              '',
              'Index + spec:',
              '```',
              simpleLine,
              '```'
            ].join('\n');
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            } catch (error) {
              console.log(`Failed to comment on PR: ${error.message}`);
              console.log('This may happen for PRs from forks due to GitHub token permissions.');
            }
