[project]
name = "datarobot-opentelemetry"
version = "0.3.0"
description = "OpenTelemetry utilities and encapsulation of semantic naming conventions for improved integration with DataRobot."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "DataRobot", email = "support@datarobot.com" }
]
requires-python = ">=3.10"
dependencies = []

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.optional-dependencies]
integrations = [
    "opentelemetry-exporter-otlp-proto-http>=1.36.0",
    "opentelemetry-instrumentation-logging>=0.64b0",
    "opentelemetry-sdk>=1.36.0",
]
fastapi = [
    "datarobot-opentelemetry[integrations]",
    "opentelemetry-instrumentation-fastapi>=0.43b0",
    "opentelemetry-instrumentation-httpx>=0.43b0",
    "opentelemetry-instrumentation-requests>=0.43b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.43b0",
]

[project.urls]
Homepage = "https://github.com/datarobot-community/datarobot-opentelemetry-integration"
Repository = "https://github.com/datarobot-community/datarobot-opentelemetry-integration"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "datarobot-opentelemetry[integrations,fastapi]",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.20",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
